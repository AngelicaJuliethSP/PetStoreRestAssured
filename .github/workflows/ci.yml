name: CI - PetStore API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Ejecución diaria 06:00 UTC (01:00 hora Colombia) — alimenta el histórico del dashboard
    - cron: "0 6 * * *"

# Evita corridas simultáneas del mismo repo (push + cron pueden solaparse);
# la publicación al dashboard usa su propio bucle de reintento para la
# carrera entre repos distintos.
concurrency:
  group: ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  api-tests:
    name: API Tests (Rest Assured)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run API tests
        run: mvn clean test -B

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-api
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: target/allure-results/
          retention-days: 7

      - name: Generate Allure HTML report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate target/allure-results -o allure-report --clean

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: allure-report/
          retention-days: 7

      - name: Publish results to dashboard
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "DASHBOARD_TOKEN no configurado — se omite la publicación (configure el secreto para activar el flujo automático)."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${DASHBOARD_TOKEN}@github.com/AngelicaJuliethSP/Proyecto-grado-dashboard.git" dashboard-repo
          EXEC_AT="${{ github.event.head_commit.timestamp }}"
          if [ -z "$EXEC_AT" ]; then
            EXEC_AT=$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")
          fi
          cd dashboard-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Los 3 repos publican al mismo almacén y pueden llegar a la vez:
          # si el push es rechazado (non-fast-forward), se toma el histórico
          # remoto actualizado, se regenera el registro sobre él (el parser
          # deduplica por proyecto+executed_at) y se reintenta.
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 parser/results_parser.py \
              --project PetStoreRestAssured \
              --reports-dir ../target/surefire-reports \
              --output data/results.json \
              --executed-at "$EXEC_AT"
            git add data/results.json
            if git diff --cached --quiet; then
              echo "Sin cambios en el histórico — nada que publicar."
              exit 0
            fi
            git commit -m "ci: resultados automaticos de PetStoreRestAssured (run ${{ github.run_id }})"
            if git push origin main; then
              echo "Resultados publicados en el dashboard."
              exit 0
            fi
            echo "Push rechazado (intento $intento/5) — reintentando con el histórico remoto."
            sleep $((RANDOM % 10 + 5))
          done
          echo "No se pudo publicar tras 5 intentos."
          exit 1
